<title>古文単語278</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#E9EBEC;
  --card:#FCFCFA;
  --card2:#F2F3F1;
  --ink:#15181E;
  --muted:#5D636E;
  --faint:#8B919B;
  --rule:#CDD1D5;
  --ai:#27406E;
  --ai-soft:#DDE3EF;
  --shu:#B02F24;
  --shu-soft:#F3DCD9;
  --ok:#2C6E54;
  --shadow:0 1px 2px rgba(20,25,35,.06),0 8px 24px rgba(20,25,35,.07);
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101319;
    --card:#1A1E27;
    --card2:#232834;
    --ink:#E7E9ED;
    --muted:#9AA1AE;
    --faint:#6F7684;
    --rule:#2E3543;
    --ai:#93A9DC;
    --ai-soft:#222B3E;
    --shu:#E4705C;
    --shu-soft:#3A2220;
    --ok:#6FBE9A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#101319;
  --card:#1A1E27;
  --card2:#232834;
  --ink:#E7E9ED;
  --muted:#9AA1AE;
  --faint:#6F7684;
  --rule:#2E3543;
  --ai:#93A9DC;
  --ai-soft:#222B3E;
  --shu:#E4705C;
  --shu-soft:#3A2220;
  --ok:#6FBE9A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.7;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:0 40px}

/* ---- header ---- */
header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
  margin-inline:-16px;padding:10px 16px 8px;
}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{
  font-family:var(--serif);font-weight:700;font-size:19px;margin:0;
  letter-spacing:.06em;
}
.brand .src{font-size:11.5px;color:var(--faint);letter-spacing:.04em}
.stats{
  display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums;flex-wrap:wrap;
}
.stats b{color:var(--ink);font-weight:700}
.stats .miss b{color:var(--shu)}

/* ---- controls ---- */
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
select,button{font-family:inherit;font-size:13px;color:var(--ink)}
select{
  appearance:none;background:var(--card);border:1px solid var(--rule);
  border-radius:7px;padding:5px 26px 5px 9px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--card)}
.seg button{
  border:0;background:transparent;padding:5px 11px;cursor:pointer;color:var(--muted);
}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ai-soft);color:var(--ai);font-weight:700}
select:focus-visible,button:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

/* ---- card ---- */
.stage{margin-top:22px}
.card{
  background:var(--card);border:1px solid var(--rule);border-radius:14px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  display:block;width:100%;text-align:inherit;font:inherit;color:inherit;
  padding:0;
}
.card::before{
  content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--ai);
  opacity:.55;
}
.card.missed::before{background:var(--shu);opacity:.9}
.face{padding:36px 22px 30px 25px;min-height:190px;display:flex;flex-direction:column;justify-content:center}
.no{
  position:absolute;top:12px;left:25px;font-size:11px;color:var(--faint);
  font-variant-numeric:tabular-nums;letter-spacing:.08em;
}
.page{position:absolute;top:12px;right:16px;font-size:11px;color:var(--faint);letter-spacing:.04em}
.word{
  font-family:var(--serif);font-weight:500;font-size:clamp(30px,8.5vw,42px);
  line-height:1.35;letter-spacing:.04em;text-wrap:balance;margin:0;
}
.hint{margin-top:14px;font-size:11.5px;color:var(--faint);letter-spacing:.1em}

.back{border-top:1px dashed var(--rule);padding:20px 22px 24px 25px;background:var(--card2)}
.kanji{
  font-family:var(--serif);font-weight:700;font-size:23px;letter-spacing:.05em;
  color:var(--ai);margin:0 0 10px;
}
.kanji .brk{color:var(--faint);font-weight:500}
.mean{font-size:16.5px;line-height:1.85;margin:0}
.note{
  margin:14px 0 0;padding-top:12px;border-top:1px solid var(--rule);
  font-size:13px;color:var(--muted);line-height:1.8;
}

/* ---- miss badge ---- */
.badge{
  position:absolute;bottom:12px;right:14px;
  font-family:var(--serif);font-weight:700;font-size:15px;
  color:var(--shu);border:1.5px solid var(--shu);border-radius:999px;
  padding:1px 11px;background:var(--shu-soft);
  font-variant-numeric:tabular-nums;letter-spacing:.06em;
  transform:rotate(-3deg);
}
.badge[hidden]{display:none!important}

/* ---- actions ---- */
.actions{display:grid;grid-template-columns:44px 1fr 1fr 44px;gap:8px;margin-top:14px}
.act{
  border:1px solid var(--rule);background:var(--card);border-radius:10px;
  padding:11px 6px;cursor:pointer;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .08s ease;
}
.act:active{transform:scale(.97)}
.act.miss{color:var(--shu);border-color:color-mix(in srgb,var(--shu) 45%,var(--rule))}
.act.miss:hover{background:var(--shu-soft)}
.act.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--rule))}
.act.nav{color:var(--muted);font-size:17px}
.act:disabled{opacity:.35;cursor:default}
.subrow{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-top:12px;font-size:12px;color:var(--faint);flex-wrap:wrap;
}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 0;font-size:12px;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--shu)}

/* ---- list ---- */
.listwrap{margin-top:20px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
.tscroll{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:var(--card)}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11px;letter-spacing:.09em;color:var(--faint);font-weight:500;background:var(--card2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;color:var(--faint);white-space:nowrap}
td.w{font-family:var(--serif);font-weight:500;white-space:nowrap}
td.m{color:var(--muted);line-height:1.6}
td.x{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.x b{color:var(--shu)}
.empty{padding:34px 16px;text-align:center;color:var(--faint);font-size:13.5px}

footer{margin-top:26px;font-size:11.5px;color:var(--faint);line-height:1.8}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>

      <h1>古文単語278</h1>
      <span class="src">四 古文単語（１）重要単語　p.58–67</span>
    </div>
    <div class="stats">
      <span>出題 <b id="st-n">0</b> 語</span>
      <span class="miss">誤答 <b id="st-miss">0</b> 回</span>
      <span>要復習 <b id="st-words">0</b> 語</span>
    </div>
    <div class="controls">
      <select id="range" aria-label="範囲"></select>
      <select id="filter" aria-label="出題範囲">
        <option value="all">全部</option>
        <option value="missed">間違えた語だけ</option>
        <option value="unseen">まだ見てない語</option>
      </select>
      <select id="order" aria-label="並び順">
        <option value="seq">番号順</option>
        <option value="shuffle">シャッフル</option>
        <option value="worst">誤答の多い順</option>
      </select>
      <span class="seg">
        <button id="tab-card" aria-pressed="true">カード</button>
        <button id="tab-list" aria-pressed="false">一覧</button>
      </span>
    </div>
  </header>

  <section id="view-card" class="stage">
    <button class="card" id="card" aria-live="polite">
      <div class="face">
        <span class="no" id="c-no"></span>
        <span class="page" id="c-page"></span>
        <p class="word" id="c-word"></p>
        <p class="hint" id="c-hint">タップで漢字と訳</p>
      </div>
      <div class="back" id="c-back" hidden>
        <p class="kanji" id="c-kanji"></p>
        <p class="mean" id="c-mean"></p>
        <p class="note" id="c-note" hidden></p>
      </div>
      <span class="badge" id="c-badge" hidden></span>
    </button>

    <div class="actions">
      <button class="act nav" id="prev" aria-label="前の語">‹</button>
      <button class="act miss" id="miss">✕ 間違えた</button>
      <button class="act ok" id="ok">○ 覚えた</button>
      <button class="act nav" id="next" aria-label="次の語">›</button>
    </div>

    <div class="subrow">
      <span id="pos"></span>
      <span>
        <button class="linkbtn" id="reset-one">この語の回数を0に</button>
        ・
        <button class="linkbtn" id="reset-all">全部リセット</button>
      </span>
    </div>
  </section>

  <section id="view-list" class="listwrap" hidden>
    <div class="tscroll">
      <table>
        <thead><tr><th>No.</th><th>古文単語</th><th>漢字</th><th>訳</th><th>誤答</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="list-empty" hidden>該当する語がない。</div>
  </section>

  <footer>
    誤答回数はこの端末のブラウザに保存される。キーボード：Space＝めくる／←→＝移動／X＝間違えた／O＝覚えた。
  </footer>
</div>

<script>
(function(){
  "use strict";
  var KEY="koten278.miss.v1", SKEY="koten278.seen.v1";
  var raw=document.getElementById("src").textContent;
  var WORDS=[], group="";
  raw.split("\n").forEach(function(line){
    if(!line.trim()) return;
    if(line.charAt(0)==="#"){ group=line.slice(1).trim(); return; }
    var p=line.split("\t");
    WORDS.push({i:WORDS.length+1,w:p[0]||"",k:p[1]||"",m:p[2]||"",note:p[3]||"",g:group});
  });

  var groups=[]; WORDS.forEach(function(x){ if(groups.indexOf(x.g)<0) groups.push(x.g); });

  function load(k){ try{ return JSON.parse(localStorage.getItem(k))||{}; }catch(e){ return {}; } }
  function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  var miss=load(KEY), seen=load(SKEY);

  var el=function(id){ return document.getElementById(id); };
  var rangeSel=el("range"), filterSel=el("filter"), orderSel=el("order");
  groups.forEach(function(g,n){
    var o=document.createElement("option"); o.value=String(n); o.textContent=g; rangeSel.appendChild(o);
  });
  var allOpt=document.createElement("option"); allOpt.value="all"; allOpt.textContent="全範囲";
  rangeSel.insertBefore(allOpt,rangeSel.firstChild); rangeSel.value="all";

  var deck=[], idx=0, flipped=false, shuffleSeed=[];

  function missOf(w){ return miss[w.w+"|"+w.i]||0; }
  function bump(w,d){
    var k=w.w+"|"+w.i, v=(miss[k]||0)+d;
    if(v<=0) delete miss[k]; else miss[k]=v;
    save(KEY,miss);
  }
  function markSeen(w){ seen[w.w+"|"+w.i]=1; save(SKEY,seen); }

  function build(){
    var g=rangeSel.value, f=filterSel.value, o=orderSel.value;
    var list=WORDS.filter(function(w){
      if(g!=="all" && w.g!==groups[Number(g)]) return false;
      if(f==="missed" && missOf(w)===0) return false;
      if(f==="unseen" && seen[w.w+"|"+w.i]) return false;
      return true;
    });
    if(o==="worst") list.sort(function(a,b){ return missOf(b)-missOf(a) || a.i-b.i; });
    else if(o==="shuffle"){
      for(var i=list.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=list[i]; list[i]=list[j]; list[j]=t; }
    }
    deck=list; if(idx>=deck.length) idx=0;
  }

  function stats(){
    var totalMiss=0, words=0;
    Object.keys(miss).forEach(function(k){ totalMiss+=miss[k]; words++; });
    el("st-n").textContent=deck.length;
    el("st-miss").textContent=totalMiss;
    el("st-words").textContent=words;
  }

  function render(){
    stats();
    var card=el("card");
    if(!deck.length){
      el("c-no").textContent=""; el("c-page").textContent="";
      el("c-word").textContent="該当なし";
      el("c-hint").textContent="範囲か絞り込みを変えて";
      el("c-back").hidden=true; el("c-badge").hidden=true;
      card.classList.remove("missed");
      el("pos").textContent="";
      el("miss").disabled=el("ok").disabled=el("prev").disabled=el("next").disabled=true;
      return;
    }
    el("miss").disabled=el("ok").disabled=false;
    el("prev").disabled=el("next").disabled=deck.length<2;
    var w=deck[idx], n=missOf(w);
    el("c-no").textContent=String(w.i).padStart(3,"0");
    el("c-page").textContent=w.g;
    el("c-word").textContent=w.w;
    el("c-hint").hidden=flipped;
    el("c-back").hidden=!flipped;
    el("c-kanji").innerHTML = w.k ? '<span class="brk">【</span>'+esc(w.k)+'<span class="brk">】</span>' : '<span class="brk">漢字表記なし</span>';
    el("c-mean").textContent=w.m;
    el("c-note").hidden=!w.note;
    el("c-note").textContent=w.note;
    el("c-badge").hidden=n===0;
    el("c-badge").textContent="✕ "+n;
    card.classList.toggle("missed",n>0);
    el("pos").textContent=(idx+1)+" / "+deck.length;
  }
  function esc(s){ return s.replace(/[&<>]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

  function flip(){ if(!deck.length) return; flipped=!flipped; if(flipped) markSeen(deck[idx]); render(); }
  function go(d){
    if(!deck.length) return;
    idx=(idx+d+deck.length)%deck.length; flipped=false; render();
    document.getElementById("view-card").scrollIntoView({block:"nearest"});
  }

  el("card").addEventListener("click",flip);
  el("prev").addEventListener("click",function(){ go(-1); });
  el("next").addEventListener("click",function(){ go(1); });
  el("miss").addEventListener("click",function(){
    if(!deck.length) return; var w=deck[idx]; bump(w,1); markSeen(w); flipped=false;
    if(filterSel.value==="unseen"){ build(); render(); } else go(1);
    stats();
  });
  el("ok").addEventListener("click",function(){
    if(!deck.length) return; markSeen(deck[idx]);
    if(filterSel.value==="unseen"){ build(); if(idx>=deck.length) idx=0; flipped=false; render(); }
    else go(1);
  });
  el("reset-one").addEventListener("click",function(){
    if(!deck.length) return; var w=deck[idx]; delete miss[w.w+"|"+w.i]; save(KEY,miss); render(); renderList();
  });
  el("reset-all").addEventListener("click",function(){
    if(!confirm("誤答回数と学習状況を全部消す。いい？")) return;
    miss={}; seen={}; save(KEY,miss); save(SKEY,seen); build(); render(); renderList();
  });

  [rangeSel,filterSel,orderSel].forEach(function(s){
    s.addEventListener("change",function(){ idx=0; flipped=false; build(); render(); renderList(); });
  });

  var tabCard=el("tab-card"), tabList=el("tab-list");
  function setTab(isCard){
    tabCard.setAttribute("aria-pressed",String(isCard));
    tabList.setAttribute("aria-pressed",String(!isCard));
    el("view-card").hidden=!isCard;
    el("view-list").hidden=isCard;
    if(!isCard) renderList();
  }
  tabCard.addEventListener("click",function(){ setTab(true); });
  tabList.addEventListener("click",function(){ setTab(false); });

  function renderList(){
    var tb=el("tbody"); tb.textContent="";
    deck.forEach(function(w){
      var n=missOf(w), tr=document.createElement("tr");
      tr.innerHTML='<td class="n">'+String(w.i).padStart(3,"0")+'</td>'+
        '<td class="w">'+esc(w.w)+'</td>'+
        '<td class="m">'+esc(w.k||"—")+'</td>'+
        '<td class="m">'+esc(w.m)+'</td>'+
        '<td class="x">'+(n?'<b>✕ '+n+'</b>':'<span style="color:var(--faint)">–</span>')+'</td>';
      tb.appendChild(tr);
    });
    el("list-empty").hidden=deck.length>0;
  }

  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="SELECT") return;
    var k=e.key.toLowerCase();
    if(k===" "||e.key==="Enter"){ e.preventDefault(); flip(); }
    else if(e.key==="ArrowRight"){ go(1); }
    else if(e.key==="ArrowLeft"){ go(-1); }
    else if(k==="x"){ el("miss").click(); }
    else if(k==="o"){ el("ok").click(); }
  });

  build(); render();
})();
</script>
