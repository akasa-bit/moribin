*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);

.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:0 40px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;

.note{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--rule);

.act.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--rule))}
.act.nav{color:var(--muted);font-size:17px}
.act:disabled{opacity:.35;cursor:default}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

        <button class="linkbtn" id="reset-all">全部リセット</button>
      </span>
    </div>
  </section>

  <section id="view-list" class="listwrap" hidden>
    <div class="tscroll">
      <table>
        <thead><tr><th>No.</th><th>古文単語</th><th>漢字</th><th>訳</th><th>誤答</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="list-empty" hidden>該当する語がない。</div>
  </section>

  <footer>
    訳が複数ある語は、めくった先で意味ごとに ✕ を押せる。下の「✕ 間違えた」は語全体の記録。<br>
    誤答回数はこの端末のブラウザに保存される。キーボード：Space＝めくる／←→＝移動／X＝間違えた／O＝覚えた／1–9＝その意味を間違えた。
  </footer>
</div>

<script>
(function(){
  "use strict";
  var KEY="koten.miss.v2", SKEY="koten.seen.v2";
  var MARKS="①②③④⑤⑥⑦⑧⑨⑩";

  var WORDS=[], group="", used={};
  document.getElementById("src").textContent.split("\n").forEach(function(line){
    if(!line.trim()) return;
    if(line.charAt(0)==="#"){ group=line.slice(1).trim(); return; }
    var p=line.split("\t");
    var w={i:WORDS.length+1,w:p[0]||"",k:p[1]||"",m:p[2]||"",note:p[3]||"",g:group};
    // storage id: independent of numbering, disambiguated when 見出し+漢字 repeat
    var base=w.w+"|"+w.k;
    used[base]=(used[base]||0)+1;
    w.id=used[base]>1?base+"~"+used[base]:base;
    w.s=splitSenses(w.m);
    WORDS.push(w);
  });

  function splitSenses(m){
    if(!m.trim()) return [];
    var out=[],cur=null;
    m.split("").forEach(function(ch){
      if(MARKS.indexOf(ch)>=0){ cur={mk:ch,txt:""}; out.push(cur); }
      else if(cur){ cur.txt+=ch; }
      else { cur={mk:"",txt:ch}; out.push(cur); }
    });
    out.forEach(function(s){ s.txt=s.txt.trim(); });
    return out;
  }

  var groups=[]; WORDS.forEach(function(x){ if(groups.indexOf(x.g)<0) groups.push(x.g); });

  function load(k){ try{ return JSON.parse(localStorage.getItem(k))||{}; }catch(e){ return {}; } }
  function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  var miss=load(KEY), seen=load(SKEY);

  var el=function(id){ return document.getElementById(id); };
  var rangeSel=el("range"), filterSel=el("filter"), orderSel=el("order");
  var allOpt=document.createElement("option"); allOpt.value="all"; allOpt.textContent="全範囲";
  rangeSel.appendChild(allOpt);
  groups.forEach(function(g,n){
    var o=document.createElement("option"); o.value=String(n); o.textContent=g; rangeSel.appendChild(o);
  });
  rangeSel.value="all";

  var deck=[], idx=0, flipped=false;

  function wordMiss(w){ return miss[w.id]||0; }
  function senseMiss(w,i){ return miss[w.id+"#"+i]||0; }
  function totalMiss(w){
    var t=wordMiss(w);
    for(var i=0;i<w.s.length;i++) t+=senseMiss(w,i);
    return t;
  }
  function bump(key){
    miss[key]=(miss[key]||0)+1; save(KEY,miss);
  }
  function clearWord(w){
    delete miss[w.id];
    for(var i=0;i<w.s.length;i++) delete miss[w.id+"#"+i];
    save(KEY,miss);
  }
  function markSeen(w){ seen[w.id]=1; save(SKEY,seen); }

  function build(){
    var g=rangeSel.value, f=filterSel.value, o=orderSel.value;
    var list=WORDS.filter(function(w){
      if(g!=="all" && w.g!==groups[Number(g)]) return false;
      if(f==="missed" && totalMiss(w)===0) return false;
      if(f==="unseen" && seen[w.id]) return false;
      return true;
    });
    if(o==="worst") list.sort(function(a,b){ return totalMiss(b)-totalMiss(a) || a.i-b.i; });
    else if(o==="shuffle"){
      for(var i=list.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=list[i]; list[i]=list[j]; list[j]=t; }
    }
    deck=list; if(idx>=deck.length) idx=0;
  }

  function stats(){
    var totalCount=0, words={};
    Object.keys(miss).forEach(function(k){
      totalCount+=miss[k];
      words[k.split("#")[0]]=1;
    });
    el("st-n").textContent=deck.length;
    el("st-miss").textContent=totalCount;
    el("st-words").textContent=Object.keys(words).length;
  }

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function renderSenses(w){
    var ul=el("c-senses"); ul.textContent="";
    w.s.forEach(function(s,i){
      var n=senseMiss(w,i);
      var li=document.createElement("li");
      li.innerHTML=(s.mk?'<span class="mk">'+esc(s.mk)+'</span>':'')+
        '<span class="txt">'+esc(s.txt)+'</span>';
      var b=document.createElement("button");
      b.type="button";
      b.className="sx"+(n?" on":"");
      b.textContent=n?"✕ "+n:"✕";
      b.title=(s.mk||"この意味")+"を間違えた";
      b.setAttribute("aria-label",(s.mk||"この意味")+"を間違えた（現在 "+n+" 回）");
      b.addEventListener("click",function(ev){
        ev.stopPropagation();
        bump(w.id+"#"+i); markSeen(w); render(); renderList();
      });
      li.appendChild(b);
      ul.appendChild(li);
    });
  }

  function render(){
    stats();
    var card=el("card");
    if(!deck.length){
      el("c-no").textContent=""; el("c-page").textContent="";
      el("c-word").textContent="該当なし";
      el("c-hint").hidden=false; el("c-hint").textContent="範囲か絞り込みを変えて";
      el("c-back").hidden=true; el("c-badge").hidden=true;
      card.classList.remove("missed");
      el("pos").textContent="";
      el("miss").disabled=el("ok").disabled=el("prev").disabled=el("next").disabled=true;
      return;
    }
    el("miss").disabled=el("ok").disabled=false;
    el("prev").disabled=el("next").disabled=deck.length<2;
    var w=deck[idx], n=totalMiss(w);
    el("c-no").textContent=String(w.i).padStart(3,"0");
    el("c-page").textContent=w.g;
    el("c-word").textContent=w.w;
    el("c-hint").hidden=flipped;
    el("c-back").hidden=!flipped;
    el("c-kanji").innerHTML = w.k
      ? '<span class="brk">【</span>'+esc(w.k)+'<span class="brk">】</span>'
      : '<span class="brk">漢字表記なし</span>';
    if(flipped) renderSenses(w);
    el("c-note").hidden=!w.note;
    el("c-note").textContent=w.note;
    el("c-badge").hidden=n===0;
    el("c-badge").textContent="✕ "+n;
    card.classList.toggle("missed",n>0);
    el("pos").textContent=(idx+1)+" / "+deck.length;
  }

  function flip(){ if(!deck.length) return; flipped=!flipped; if(flipped) markSeen(deck[idx]); render(); }
  function go(d){
    if(!deck.length) return;
    idx=(idx+d+deck.length)%deck.length; flipped=false; render();
  }

  el("card").addEventListener("click",flip);
  el("card").addEventListener("keydown",function(e){
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); }
  });
  el("prev").addEventListener("click",function(){ go(-1); });
  el("next").addEventListener("click",function(){ go(1); });
  el("miss").addEventListener("click",function(){
    if(!deck.length) return;
    var w=deck[idx]; bump(w.id); markSeen(w); flipped=false;
    if(filterSel.value==="unseen"){ build(); render(); } else go(1);
    renderList();
  });
  el("ok").addEventListener("click",function(){
    if(!deck.length) return;
    markSeen(deck[idx]);
    if(filterSel.value==="unseen"){ build(); if(idx>=deck.length) idx=0; flipped=false; render(); }
    else go(1);
  });
  el("reset-one").addEventListener("click",function(){
    if(!deck.length) return; clearWord(deck[idx]); render(); renderList();
  });
  el("reset-all").addEventListener("click",function(){
    if(!confirm("誤答回数と学習状況を全部消す。いい？")) return;
    miss={}; seen={}; save(KEY,miss); save(SKEY,seen); build(); render(); renderList();
  });
  [rangeSel,filterSel,orderSel].forEach(function(s){
    s.addEventListener("change",function(){ idx=0; flipped=false; build(); render(); renderList(); });
  });

  var tabCard=el("tab-card"), tabList=el("tab-list");
  function setTab(isCard){
    tabCard.setAttribute("aria-pressed",String(isCard));
    tabList.setAttribute("aria-pressed",String(!isCard));
    el("view-card").hidden=!isCard;
    el("view-list").hidden=isCard;
    if(!isCard) renderList();
  }
  tabCard.addEventListener("click",function(){ setTab(true); });
  tabList.addEventListener("click",function(){ setTab(false); });

  function renderList(){
    if(el("view-list").hidden) return;
    var tb=el("tbody"); tb.textContent="";
    deck.forEach(function(w){
      var n=totalMiss(w), parts=[];
      w.s.forEach(function(s,i){ var c=senseMiss(w,i); if(c) parts.push((s.mk||"—")+c); });
      var tr=document.createElement("tr");
      tr.innerHTML='<td class="n">'+String(w.i).padStart(3,"0")+'</td>'+
        '<td class="w">'+esc(w.w)+'</td>'+
        '<td class="m">'+esc(w.k||"—")+'</td>'+
        '<td class="m">'+esc(w.m)+'</td>'+
        '<td class="x">'+(n?'<b>✕ '+n+'</b>'+(parts.length?'<span class="brk">'+esc(parts.join(" "))+'</span>':'')
                          :'<span style="color:var(--faint)">–</span>')+'</td>';
      tb.appendChild(tr);
    });
    el("list-empty").hidden=deck.length>0;
  }

  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="SELECT") return;
    if(e.target===el("card")) return;
    var k=e.key.toLowerCase();
    if(k===" "||e.key==="Enter"){ e.preventDefault(); flip(); }
    else if(e.key==="ArrowRight"){ go(1); }
    else if(e.key==="ArrowLeft"){ go(-1); }
    else if(k==="x"){ el("miss").click(); }
    else if(k==="o"){ el("ok").click(); }
    else if(/^[1-9]$/.test(e.key) && flipped && deck.length){
      var w=deck[idx], i=Number(e.key)-1;
      if(i<w.s.length){ bump(w.id+"#"+i); markSeen(w); render(); renderList(); }
    }
  });

  build(); render();
})();
</script>
